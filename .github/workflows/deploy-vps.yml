name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Publish Docker image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag a desplegar (default: latest). Ej: main-abc1234'
        required: false
        default: 'latest'

# Evita que dos deploys peleen por el mismo contenedor.
concurrency:
  group: deploy-${{ github.event.repository.name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment: production

    steps:
      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            DEPLOY_DIR="${{ secrets.VPS_DEPLOY_DIR_FRONT || '$HOME/koom-calls-front' }}"
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}"

            cd "$DEPLOY_DIR"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE"
            docker rm -f koom-calls-front || true

            # El front participa en dos redes:
            #   koom-net  → habla con el back (koom-calls-server:8080)
            #   npm-proxy → accesible por Nginx Proxy Manager por DNS interno
            docker network inspect koom-net  >/dev/null 2>&1 || docker network create koom-net
            docker network inspect npm-proxy >/dev/null 2>&1 || docker network create npm-proxy

            docker run -d \
              --name koom-calls-front \
              --restart unless-stopped \
              --network koom-net \
              --network npm-proxy \
              -p 8081:8080 \
              "$IMAGE"

            for i in $(seq 1 20); do
              if curl -fsS http://localhost:8081/health >/dev/null 2>&1; then
                echo "Frontend healthy after ${i}s"
                break
              fi
              sleep 1
            done
            if ! curl -fsS http://localhost:8081/health >/dev/null 2>&1; then
              echo "::error::Frontend unhealthy after 20s"
              docker logs --tail 50 koom-calls-front || true
              exit 1
            fi

            echo "Deploy completed: $(docker inspect --format '{{.Image}}' koom-calls-front)"
